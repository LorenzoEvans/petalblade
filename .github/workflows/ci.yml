name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo doc
        run: cargo doc --workspace --all-features --no-deps
  test:
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo test --locked
        run: cargo test --workspace --locked --all-features

  release:
    name: release ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, doc, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/petalblade
          cp target/release/petalblade dist/petalblade/
          cp README.md LICENSE dist/petalblade/
          tar -C dist -czf "petalblade-${{ runner.os }}-${{ runner.arch }}.tar.gz" petalblade
          shasum -a 256 "petalblade-${{ runner.os }}-${{ runner.arch }}.tar.gz" > "petalblade-${{ runner.os }}-${{ runner.arch }}.tar.gz.sha256"
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/petalblade
          Copy-Item target/release/petalblade.exe dist/petalblade/
          Copy-Item README.md, LICENSE dist/petalblade/
          Compress-Archive -Path dist/petalblade -DestinationPath "petalblade-${{ runner.os }}-${{ runner.arch }}.zip"
          Get-FileHash "petalblade-${{ runner.os }}-${{ runner.arch }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  petalblade-${{ runner.os }}-${{ runner.arch }}.zip" } |
            Set-Content "petalblade-${{ runner.os }}-${{ runner.arch }}.zip.sha256"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            petalblade-*.tar.gz
            petalblade-*.tar.gz.sha256
            petalblade-*.zip
            petalblade-*.zip.sha256
